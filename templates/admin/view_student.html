<!DOCTYPE html>
<html>

<head>
    <title>Student Details</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-light text-center">
                        <h4 class="mb-0">Student Details</h4>
                    </div>                   
                    <div class="card-body">                       
                        <h5 class="text-primary mb-3">
                            {{ student.name }}
                        </h5>                        
                        <div class="row mb-2">
                            <div class="col-md-4 fw-semibold">
                                Email
                            </div>
                            <div class="col-md-8">
                                {{ student.email }}
                            </div>
                        </div>   
                        <div class="row mb-2">
                            <div class="col-md-4 fw-semibold">
                                Phone Number
                            </div>

                            <div class="col-md-8">
                                {{ student.phone_number }}
                            </div>
                        </div>                      
                        <div class="row mb-2">
                            <div class="col-md-4 fw-semibold">
                                Course
                            </div>
                            <div class="col-md-8">
                                {{ student.course }}
                            </div>
                        </div>                       
                        <div class="row mb-2">
                            <div class="col-md-4 fw-semibold">
                                Year
                            </div>

                            <div class="col-md-8">
                                {{ student.year }}
                            </div>
                        </div>                        
                                               
                        <div class="row mb-2">
                            <div class="col-md-4 fw-semibold">
                                Department
                            </div>

                            <div class="col-md-8">
                                {{ student.department }}
                            </div>
                        </div>                        
                        <div class="row mb-2">
                            <div class="col-md-4 fw-semibold">
                                Institution
                            </div>

                            <div class="col-md-8 text-success fw-semibold">
                                {{ student.institution }}
                            </div>
                        </div>                        
                        <div class="row mb-3">
                            <div class="col-md-4 fw-semibold">
                                Blacklisted
                            </div>

                            <div class="col-md-8 text-danger">
                                {{ student.is_blacklisted }}
                            </div>
                        </div>                       
                        <div class="text-center mt-4">
                            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-primary">
                                Back to Dashboard
                            </a>
                        </div>
                    </div> 
                </div> 
            </div> 
        </div> 
    </div> 
</body>
</html>
