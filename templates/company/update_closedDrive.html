<!DOCTYPE html>
<html>

<head>
    <title>Update Placement Drive</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <!-- Card Header -->
                <div class="card-header bg-light text-center">
                    <h4 class="mb-0">Update Placement Drive</h4>
                </div>

                <!-- Card Body -->
                <div class="card-body">

                    <form method="post"
                          action="{{ url_for('company.update_closed_drive', drive_id=drive.id) }}">

                        <!-- Drive Name -->
                        <div class="mb-3">
                            <label class="form-label">Drive Name</label>
                            <input
                                type="text"
                                name="drive_name"
                                class="form-control"
                                value="{{ drive.drive_name }}"
                                required>
                        </div>


                        <!-- Job Title -->
                        <div class="mb-3">
                            <label class="form-label">Job Title</label>
                            <input
                                type="text"
                                name="job_title"
                                class="form-control"
                                value="{{ drive.job_title }}"
                                required>
                        </div>


                        <!-- Job Description -->
                        <div class="mb-3">
                            <label class="form-label">Job Description</label>
                            <textarea
                                name="job_description"
                                class="form-control"
                                rows="3">{{ drive.job_description }}</textarea>
                        </div>


                        <!-- Eligibility -->
                        <div class="mb-3">
                            <label class="form-label">Eligibility</label>
                            <input
                                type="text"
                                name="eligibility"
                                class="form-control"
                                value="{{ drive.eligibility }}">
                        </div>


                        <!-- Location -->
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                value="{{ drive.location }}">
                        </div>


                        <!-- Salary -->
                        <div class="mb-3">
                            <label class="form-label">Salary</label>
                            <input
                                type="text"
                                name="salary"
                                class="form-control"
                                value="{{ drive.salary }}">
                        </div>


                        <!-- Application Deadline -->
                        <div class="mb-3">
                            <label class="form-label">Application Deadline</label>
                            <input
                                type="date"
                                name="deadline"
                                class="form-control"
                                value="{{ drive.deadline }}">
                        </div>


                        <!-- Drive Status -->
                        <div class="mb-3">
                            <label class="form-label">Drive Status</label>

                            <select name="status" class="form-select">

                                <option value="Active"
                                {% if drive.status == 'Active' %}
                                selected
                                {% endif %}>
                                    Active
                                </option>

                                <option value="Closed"
                                {% if drive.status == 'Closed' %}
                                selected
                                {% endif %}>
                                    Closed
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('company.dashboard') }}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Drive
                            </button>

                        </div>

                    </form>

                </div> <!-- End Card Body -->

            </div> <!-- End Card -->

        </div> <!-- End Column -->

    </div> <!-- End Row -->

</div> <!-- End Container -->

</body>

</html>
