<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>



<body class="bg-light">

    <!-- Main Container -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">


                <!-- Card -->
                <div class="card shadow-sm">

                    <!-- Card Header -->
                    <div class="card-header text-center bg-light">
                        <h4>Create Account</h4>
                    </div>



                    <!-- Card Body -->
                    <div class="card-body">


                        <!-- Flash Messages -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}

                                    <div class="alert alert-{{ category }}">
                                        {{ message }}
                                    </div>

                                {% endfor %}
                            {% endif %}
                        {% endwith %}



                        <!-- Tabs Navigation -->
                        <ul class="nav nav-tabs mb-3" role="tablist">

                            <li class="nav-item">
                                <button
                                    class="nav-link active"
                                    data-bs-toggle="tab"
                                    data-bs-target="#student"
                                >
                                    Student
                                </button>
                            </li>

                            <li class="nav-item">
                                <button
                                    class="nav-link"
                                    data-bs-toggle="tab"
                                    data-bs-target="#company"
                                >
                                    Company
                                </button>
                            </li>

                        </ul>



                        <!-- Tabs Content -->
                        <div class="tab-content">



                            <!-- STUDENT REGISTRATION FORM -->
                            <div class="tab-pane fade show active" id="student">

                                <form
                                    action="{{ url_for('auth.student_register') }}"
                                    method="post"
                                >

                                    <div class="mb-3">
                                        <label class="form-label">Full Name *</label>
                                        <input
                                            type="text"
                                            name="name"
                                            class="form-control"
                                            required
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Email *</label>
                                        <input
                                            type="email"
                                            name="email"
                                            class="form-control"
                                            required
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Phone</label>
                                        <input
                                            type="tel"
                                            name="phone"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Institution</label>
                                        <input
                                            type="text"
                                            name="institution"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Course</label>
                                        <input
                                            type="text"
                                            name="course"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Department</label>
                                        <input
                                            type="text"
                                            name="department"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Year</label>
                                        <input
                                            type="text"
                                            name="year"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Password *</label>
                                        <input
                                            type="password"
                                            name="password"
                                            class="form-control"
                                            required
                                        >
                                    </div>



                                    <button
                                        type="submit"
                                        class="btn btn-primary"
                                    >
                                        Register as Student
                                    </button>

                                </form>

                            </div>



                            <!-- COMPANY REGISTRATION FORM -->
                            <div class="tab-pane fade" id="company">

                                <form
                                    action="{{ url_for('auth.company_register') }}"
                                    method="post"
                                >

                                    <div class="mb-3">
                                        <label class="form-label">Company Name *</label>
                                        <input
                                            type="text"
                                            name="company_name"
                                            class="form-control"
                                            required
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Email *</label>
                                        <input
                                            type="email"
                                            name="email"
                                            class="form-control"
                                            required
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Description</label>
                                        <textarea
                                            name="description"
                                            class="form-control"
                                        ></textarea>
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">HR Contact</label>
                                        <input
                                            type="text"
                                            name="hr_contact"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Website</label>
                                        <input
                                            type="url"
                                            name="website"
                                            class="form-control"
                                        >
                                    </div>



                                    <div class="mb-3">
                                        <label class="form-label">Password *</label>
                                        <input
                                            type="password"
                                            name="password"
                                            class="form-control"
                                            required
                                        >
                                    </div>



                                    <button
                                        type="submit"
                                        class="btn btn-secondary"
                                    >
                                        Register as Company
                                    </button>

                                </form>

                            </div>



                        </div> <!-- End tab-content -->



                        <hr>



                        <!-- Login Link -->
                        <p class="text-center">
                            Already have an account?
                            <a href="{{ url_for('auth.login') }}">
                                Login here
                            </a>
                        </p>



                    </div> <!-- End Card Body -->


                </div> <!-- End Card -->


            </div> <!-- End Column -->


        </div> <!-- End Row -->


    </div> <!-- End Container -->



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
