<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <!-- Card Header -->
                <div class="card-header bg-light text-center">
                    <h4 class="mb-0">Drive Details</h4>
                </div>


                <!-- Card Body -->
                <div class="card-body">

                    <!-- Drive Name -->
                    <h5 class="text-primary mb-3">
                        {{ drive.drive_name }}
                    </h5>


                    <!-- Job Title -->
                    <div class="row mb-2">
                        <div class="col-md-4 fw-semibold">
                            Job Title
                        </div>

                        <div class="col-md-8">
                            {{ drive.job_title }}
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-4 fw-semibold">
                            Descriptons
                        </div>

                        <div class="col-md-8">
                            {{ drive.job_description }}
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-4 fw-semibold">
                            Location
                        </div>

                        <div class="col-md-8">
                            {{ drive.location }}
                        </div>
                    </div>

                    <!-- Eligibility -->
                    <div class="row mb-2">
                        <div class="col-md-4 fw-semibold">
                            Eligibility
                        </div>

                        <div class="col-md-8">
                            {{ drive.eligibility }}
                        </div>
                    </div>


                    <!-- Salary -->
                    <div class="row mb-2">
                        <div class="col-md-4 fw-semibold">
                            Salary
                        </div>

                        <div class="col-md-8 text-success fw-semibold">
                            {{ drive.salary }}
                        </div>
                    </div>


                    <!-- Deadline -->
                    <div class="row mb-3">
                        <div class="col-md-4 fw-semibold">
                            Application Deadline
                        </div>

                        <div class="col-md-8 text-danger">
                            {{ drive.application_deadline }}
                        </div>
                    </div>


                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-between mt-4">

                        <a href="{{ url_for('student.view_company', company_id=drive.company_id) }}"
                           class="btn btn-outline-secondary">

                            Back

                        </a>


                        <a href="{{ url_for('student.apply_drive', drive_id=drive.id) }}"
                           class="btn btn-success">

                            Apply

                        </a>

                    </div>

                </div> <!-- End Card Body -->

            </div> <!-- End Card -->

        </div> <!-- End Column -->

    </div> <!-- End Row -->

</div> <!-- End Container -->

</body>

</html>
