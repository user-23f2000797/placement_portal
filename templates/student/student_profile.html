<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <!-- Card Header -->
                <div class="card-header bg-light text-center">
                    <h4 class="mb-0">Edit Profile</h4>
                </div>


                <!-- Card Body -->
                <div class="card-body">

                    <!-- Back Button -->
                    <div class="mb-3" align="right">
                        <a href="{{ url_for('student.dashboard') }}"
                           class="btn btn-outline-secondary btn-sm">
                            Back to Dashboard
                        </a>
                    </div>


                    <!-- Profile Form -->
                    <form method="post">

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ student.name }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="text"
                                name="email"
                                class="form-control"
                                value="{{ student.email }}"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ student.phone }}">
                        </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Institution</label>
                            <input
                                type="text"
                                name="institution"
                                class="form-control"
                                value="{{ student.institution }}"
                                required>
                        </div>

                        
                        <div class="mb-3">
                            <label class="form-label">department</label>
                            <input
                                type="text"
                                name="department"
                                class="form-control"
                                value="{{ student.department }}">
                        </div>


                        <!-- Course -->
                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <input
                                type="text"
                                name="course"
                                class="form-control"
                                value="{{ student.course }}">
                        </div>


                        <!-- Year -->
                        <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input
                                type="text"
                                name="year"
                                class="form-control"
                                value="{{ student.year }}">
                        </div>


                        <!-- Submit Button -->
                        <div class="text-end">

                            <button type="submit"
                                    class="btn btn-primary">
                                Update Profile
                            </button>

                        </div>

                    </form>

                </div> <!-- End Card Body -->

            </div> <!-- End Card -->

        </div> <!-- End Column -->

    </div> <!-- End Row -->

</div> <!-- End Container -->

</body>

</html>
